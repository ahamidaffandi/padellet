<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
  :root {
    --bg: #0C0F17;
    --surface: #171C2C;
    --surface-2: #1E2438;
    --surface-3: #262E48;
    --ink: #F2F4F9;
    --ink-muted: #99A1B8;
    --ink-faint: #6A7290;
    --line: #2A3149;
    --line-strong: #3B4262;
    --accent: #D9A94E;
    --accent-soft: #E9C97E;
    --accent-ink: #241A03;
    --men: #7CB2D6;
    --men-bg: #17324A;
    --men-line: #2A5578;
    --women: #E48BAC;
    --women-bg: #3B2130;
    --women-line: #5C2E42;
    --good: #5FBF88;
    --good-bg: #123326;
    --warn: #E4A94F;
    --live-dot: #E4574F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 14mm;
  }
  h1, h2, h3 { font-family: "Bebas Neue", sans-serif; font-weight: 400; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  input[type="number"] {
    font-family: "Barlow Semi Condensed", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  button { font-family: "Barlow Semi Condensed", sans-serif; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent-soft); outline-offset: 2px;
  }

  /* ---- topbar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(12,15,23,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 3mm 4mm 0;
  }
  .topbar-row { display: flex; align-items: center; gap: 3mm; justify-content: space-between; flex-wrap: wrap; }
  .topbar-id { display: flex; align-items: center; gap: 2.6mm; }
  .topbar-logo { width: 9mm; height: 9mm; border-radius: 50%; object-fit: cover; border: 1.4px solid var(--accent); flex-shrink: 0; }
  .topbar-name { font-family: "Bebas Neue", sans-serif; font-size: 15pt; letter-spacing: 0.01em; line-height: 1.05; }
  .topbar-sub { font-family: "Barlow Semi Condensed", sans-serif; font-size: 7.6pt; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); }
  .live-clock { font-family: "Barlow Semi Condensed", sans-serif; font-size: 8pt; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; align-items: center; gap: 1.6mm; }
  .live-dot { width: 1.8mm; height: 1.8mm; border-radius: 50%; background: var(--live-dot); box-shadow: 0 0 0 3px rgba(228,87,79,0.18); }

  .tabs { display: flex; gap: 1.5mm; margin-top: 3mm; }
  .tab-btn {
    background: none; border: none; border-bottom: 2.4px solid transparent;
    color: var(--ink-faint); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; font-size: 9.5pt; padding: 2.6mm 1mm 2.4mm;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn[aria-selected="true"] { color: var(--accent-soft); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--ink); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 5mm 4mm 0; }
  .panel[hidden] { display: none; }

  /* ---- banner ---- */
  .banner {
    max-width: 1180px; margin: 3mm auto 0; padding: 2.6mm 4mm;
    background: var(--surface-2); border: 1px solid var(--line-strong); border-left: 3px solid var(--warn);
    border-radius: 1.5mm; font-size: 8.6pt; color: var(--ink-muted); display: none;
  }
  .banner.show { display: block; }
  .toast-host { position: fixed; bottom: 4mm; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 2mm; align-items: center; }
  .toast {
    background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--ink);
    padding: 2.2mm 4mm; border-radius: 20px; font-size: 8.6pt; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    animation: toast-in .18s ease;
  }
  .toast.err { border-color: #6a2f2c; color: #f2b8b3; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }

  /* ---- section heads ---- */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6mm 0 3mm; flex-wrap: wrap; gap: 2mm; }
  .section-title { font-size: 20pt; }
  .section-note { font-size: 8.6pt; color: var(--ink-faint); max-width: 60ch; }
  .pill {
    font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 7.6pt;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 1.2mm 2.6mm; border-radius: 20px;
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-muted);
  }
  .pill.men { color: var(--men); border-color: var(--men-line); background: var(--men-bg); }
  .pill.women { color: var(--women); border-color: var(--women-line); background: var(--women-bg); }
  .pill.good { color: var(--good); border-color: #1f5a3f; background: var(--good-bg); }

  /* ---- cards / tables shared ---- */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 3.5mm; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 3mm; overflow: hidden;
  }
  .card-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2.6mm 3.6mm; background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .card-h-title { font-family: "Bebas Neue", sans-serif; font-size: 13pt; letter-spacing: 0.02em; display: flex; align-items: center; gap: 2mm; }
  .card-body { padding: 3mm 3.6mm 3.6mm; }

  table { border-collapse: collapse; width: 100%; font-size: 8.8pt; }
  .standings-tbl th { text-align: left; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 7pt; color: var(--ink-faint); padding: 1.4mm 1.8mm; border-bottom: 1px solid var(--line-strong); }
  .standings-tbl td { padding: 1.6mm 1.8mm; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .standings-tbl td.num, .standings-tbl th.num { text-align: center; font-variant-numeric: tabular-nums; }
  .standings-tbl tr.qualified td.rank { color: var(--good); font-weight: 700; }
  .standings-tbl tr.bye td.rank { color: var(--accent-soft); font-weight: 700; }
  .standings-tbl td.rank { font-family: "Bebas Neue", sans-serif; font-size: 12pt; width: 6mm; color: var(--ink-faint); }
  .standings-tbl td.pname { font-weight: 600; }
  .tag-inline { font-size: 6.6pt; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); display: block; }
  .standings-note { font-size: 7.6pt; color: var(--ink-faint); margin-top: 2mm; }

  /* ---- match score rows ---- */
  .match-list { display: flex; flex-direction: column; gap: 1.6mm; margin-top: 2.6mm; }
  .match-row {
    display: flex; align-items: flex-start; gap: 2.4mm; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 2mm; padding: 2mm 2.4mm;
  }
  .match-row.done { border-color: #1f5a3f; }
  .match-row .mnames { flex: 1; min-width: 0; font-size: 8.4pt; display: flex; flex-direction: column; gap: 0.8mm; padding-top: 0.6mm; }
  .match-row .mnames .side { line-height: 1.25; }
  .match-row .mnames .side.winner { color: var(--good); font-weight: 700; }
  .match-row .score-inputs, .match-row .save-btn, .match-row .done-check { margin-top: 0.6mm; }
  .score-inputs { display: flex; align-items: center; gap: 1.2mm; flex-shrink: 0; }
  .score-inputs input {
    width: 9mm; text-align: center; background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 1.4mm; color: var(--ink); font-size: 9pt; padding: 1.2mm 0;
  }
  .score-inputs input:focus { border-color: var(--accent); }
  .score-dash { color: var(--ink-faint); font-size: 8pt; }
  .save-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 1.6mm;
    font-weight: 700; font-size: 7.6pt; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1.6mm 2.4mm; flex-shrink: 0;
  }
  .save-btn:disabled { background: var(--surface-3); color: var(--ink-faint); cursor: default; }
  .done-check { color: var(--good); font-size: 11pt; flex-shrink: 0; width: 5mm; text-align: center; }

  /* ---- schedule (jadwal) tab ---- */
  .tbl-wrap { border: 1px solid var(--line); border-radius: 2.5mm; overflow: auto; }
  .grid-tbl { font-size: 8.2pt; min-width: 640px; }
  .grid-tbl th, .grid-tbl td { padding: 1.8mm 2.2mm; border-top: 1px solid var(--line); text-align: center; }
  .grid-tbl thead th { background: var(--surface-2); text-align: center; font-family: "Barlow Semi Condensed", sans-serif; text-transform: uppercase; letter-spacing: 0.05em; font-size: 6.8pt; color: var(--ink-muted); border-top: none; }
  .grid-tbl td.timecell, .grid-tbl th.timecell { text-align: left; }
  .grid-tbl td.timecell { background: var(--surface-2); white-space: nowrap; font-size: 8pt; }
  .grid-tbl td.timecell .rlabel { display: block; color: var(--ink-faint); font-size: 6.6pt; text-transform: uppercase; letter-spacing: 0.03em; }
  .grid-tbl td.empty { color: var(--ink-faint); }
  .ko-label { font-weight: 700; font-size: 7.6pt; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent-soft); }
  .mcode { font-weight: 600; font-size: 8pt; white-space: nowrap; }
  .mcode .vs { color: var(--ink-faint); font-weight: 400; font-size: 6.8pt; }
  .mcode.men { color: var(--men); }
  .mcode.women { color: var(--women); }
  .cellname { font-weight: 600; font-size: 8pt; line-height: 1.25; }
  .cellvs { color: var(--ink-faint); font-size: 6.6pt; text-transform: uppercase; letter-spacing: 0.05em; margin: 0.6mm 0; }
  .cellscore { color: var(--good); font-weight: 700; font-size: 8.4pt; margin-top: 1mm; font-variant-numeric: tabular-nums; }
  .note { display: flex; align-items: baseline; gap: 2mm; margin-top: 4mm; padding: 2.6mm 3.6mm; background: var(--surface-2); border: 1px solid var(--line-strong); border-left: 3px solid var(--warn); border-radius: 1.5mm; font-size: 8.2pt; color: var(--ink-muted); }
  .note span:first-child { color: var(--warn); flex-shrink: 0; }
  .grid-tbl tr.break-row td { background: var(--surface-3); text-align: center; color: var(--accent-soft); font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 7.2pt; padding: 2mm; }
  .ko-sched-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 3mm; margin-top: 3mm; }
  .ko-sched-block { border: 1px solid var(--line); border-radius: 2.5mm; overflow: hidden; }
  .ko-sched-h { background: var(--surface-2); display: flex; justify-content: space-between; padding: 2mm 3mm; font-size: 7.8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .ko-sched-h .kt { color: var(--accent); }
  .ko-sched-block table { font-size: 7.8pt; }
  .ko-sched-block td, .ko-sched-block th { padding: 1.5mm 2.2mm; }
  .legend-note { font-size: 8pt; color: var(--ink-faint); margin: 2mm 0 0; }

  /* ---- bracket boxes ---- */
  .bracket-scroll { overflow-x: auto; padding-bottom: 2mm; }
  .bracket-cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 3mm; align-items: stretch; min-width: 640px; }
  .bcol { display: flex; flex-direction: column; gap: 2.6mm; }
  .bcol.qf { justify-content: space-between; }
  .bcol.sf { justify-content: space-around; }
  .bcol.fin { justify-content: center; }
  .bcol.champ { justify-content: center; }
  .bcol.pin { justify-content: space-between; }
  .bcol-h { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 7pt; color: var(--ink-faint); text-align: center; margin-bottom: 0.5mm; }
  .bbox { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 2mm; padding: 2mm 2.6mm; font-size: 8pt; line-height: 1.3; }
  .bbox.pending { opacity: 0.55; }
  .bbox .b-tag { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 6.6pt; color: var(--accent); display: block; margin-bottom: 1mm; }
  .bbox .b-row { color: var(--ink-muted); padding: 0.5mm 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bbox .b-row.strong { color: var(--ink); }
  .bbox .b-row.winner { color: var(--good); font-weight: 700; }
  .bbox .b-vs { border-top: 1px dashed var(--line-strong); margin: 1mm 0; }
  .bbox .b-score { display: flex; gap: 1.2mm; align-items: center; margin-top: 1.4mm; }
  .bbox .b-score input { width: 8mm; text-align: center; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 1.2mm; color: var(--ink); font-size: 8.4pt; padding: 1mm 0; }
  .bbox .b-score button { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 1.4mm; font-weight: 700; font-size: 7pt; padding: 1mm 2mm; }
  .bbox.champ-box { border: 1.4px solid var(--accent); background: linear-gradient(160deg, var(--surface-2), var(--surface)); text-align: center; padding: 3.4mm 2mm; }
  .bbox.champ-box .b-tag { color: var(--accent); font-size: 7.6pt; margin-bottom: 1.4mm; }
  .bbox.champ-box .b-row.strong { white-space: normal; }

  .bracket-block { margin-top: 5mm; }
  .bracket-block:first-child { margin-top: 0; }
  .bracket-title { font-family: "Bebas Neue", sans-serif; font-size: 14pt; margin: 0 0 2.4mm; display: flex; align-items: center; gap: 2.2mm; }
  .bracket-title .dot { width: 2.4mm; height: 2.4mm; border-radius: 50%; background: var(--accent); }

  footer.appfoot { max-width: 1180px; margin: 8mm auto 0; padding: 3mm 4mm; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 7.4pt; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); flex-wrap: wrap; gap: 1mm; }

  @media (max-width: 640px) {
    .topbar-name { font-size: 12pt; }
    .section-title { font-size: 16pt; }
    .tabs { overflow-x: auto; }
  }

  .topbar-actions { display: flex; align-items: center; gap: 3mm; }
  .mode-pill { }
  .admin-btn {
    background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--ink-muted);
    font-weight: 700; font-size: 7.6pt; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1.8mm 3.2mm; border-radius: 20px; transition: color .15s ease, border-color .15s ease;
  }
  .admin-btn:hover { color: var(--accent-soft); border-color: var(--accent); }
  .admin-btn.ghost-btn { color: #f87171; border-color: rgba(248,113,113,0.4); }
  .admin-btn.ghost-btn:hover { color: #fca5a5; border-color: #f87171; }

  @media (max-width: 640px) {
    .topbar-row { gap: 2mm; }
    .topbar-actions { gap: 1.6mm; flex-wrap: wrap; justify-content: flex-end; }
    .admin-btn { font-size: 7pt; padding: 1.6mm 2.4mm; }
  }
</style>
</head>

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function matchKey(a,b) { return a + '-' + b; }
function getPairs(g) { return g === 'W' ? SCHEDULE.women : SCHEDULE.groupsMen[g]; }
function getGroupRounds(g) { return g === 'W' ? SCHEDULE.womenRounds : SCHEDULE.menRounds; }
function getGroupMatches(g) {
  const rounds = getGroupRounds(g);
  const list = [];
  rounds.forEach((rp, ri) => rp.forEach(pair => list.push({ round: ri+1, a: pair[0], b: pair[1] })));
  return list;
}
function getGroupScore(state, g, a, b) {
  const gs = (state.groupScores && state.groupScores[g]) || {};
  const v = gs[matchKey(a,b)];
  return Array.isArray(v) ? v : null;
}

/* ================= Standings ================= */
function sortStandings(stats, results) {
  const byWins = {};
  stats.forEach(s => { (byWins[s.wins] = byWins[s.wins] || []).push(s); });
  const winVals = Object.keys(byWins).map(Number).sort((a,b) => b - a);
  let ordered = [];
  winVals.forEach(w => {
    let cluster = byWins[w].slice();
    if (cluster.length === 2) {
      const x = cluster[0], y = cluster[1];
      const key = matchKey(Math.min(x.idx,y.idx), Math.max(x.idx,y.idx));
      const r = results[key];
      if (r) cluster = (r.winnerIdx === x.idx) ? [x,y] : [y,x];
      else cluster.sort((p,q) => (q.gf-q.ga)-(p.gf-p.ga) || (q.gf-p.gf));
    } else if (cluster.length > 1) {
      cluster.sort((p,q) => (q.gf-q.ga)-(p.gf-p.ga) || (q.gf-p.gf));
    }
    ordered = ordered.concat(cluster);
  });
  return ordered;
}
function computeStandings(state, g) {
  const pairs = getPairs(g);
  const matches = getGroupMatches(g);
  const stats = pairs.map((name,i) => ({ idx: i+1, name, wins:0, losses:0, gf:0, ga:0, played:0 }));
  const results = {};
  let completed = 0;
  matches.forEach(m => {
    const sc = getGroupScore(state, g, m.a, m.b);
    if (sc && Number.isFinite(sc[0]) && Number.isFinite(sc[1]) && sc[0] !== sc[1]) {
      completed++;
      const winnerIdx = sc[0] > sc[1] ? m.a : m.b;
      const loserIdx = sc[0] > sc[1] ? m.b : m.a;
      results[matchKey(m.a,m.b)] = { winnerIdx, loserIdx };
      const sa = stats[m.a-1], sb = stats[m.b-1];
      sa.played++; sb.played++;
      sa.gf += sc[0]; sa.ga += sc[1];
      sb.gf += sc[1]; sb.ga += sc[0];
      if (winnerIdx === m.a) { sa.wins++; sb.losses++; } else { sb.wins++; sa.losses++; }
    }
  });
  const complete = completed === matches.length;
  return { group: g, pairs, matches, stats, results, complete, ordered: sortStandings(stats, results), total: matches.length, completed };
}

/* ================= Bracket resolution ================= */
function getKoScore(state, id) {
  const v = state.koScores ? state.koScores[id] : null;
  return Array.isArray(v) ? v : null;
}
function makeMatch(state, id, sideA, sideB, stage) {
  const sc = getKoScore(state, id);
  let winner = null, loser = null, scoreA = null, scoreB = null;
  if (sideA && sideB && sc && Number.isFinite(sc[0]) && Number.isFinite(sc[1]) && sc[0] !== sc[1]) {
    scoreA = sc[0]; scoreB = sc[1];
    winner = sc[0] > sc[1] ? sideA : sideB;
    loser = sc[0] > sc[1] ? sideB : sideA;
  }
  return { id, sideA, sideB, scoreA, scoreB, winner, loser, stage, ready: !!(sideA && sideB) };
}
function resolveAll(state) {
  const standings = {};
  ['A','B','C','D','W'].forEach(g => { standings[g] = computeStandings(state, g); });
  function rankOf(g, r) {
    const st = standings[g];
    if (!st.complete) return null;
    const p = st.ordered[r-1];
    return p ? { name: p.name, ref: g + String(r) } : null;
  }
  const m = {};
  ['A','B','C','D'].forEach(g => {
    m['PI-'+g] = makeMatch(state, 'PI-'+g, rankOf(g,4), rankOf(g,5), 'Play-in Consolation');
  });
  m['MQF1'] = makeMatch(state, 'MQF1', rankOf('A',1), rankOf('B',2), 'Perempat Final \u2014 Main Draw');
  m['MQF2'] = makeMatch(state, 'MQF2', rankOf('B',1), rankOf('A',2), 'Perempat Final \u2014 Main Draw');
  m['MQF3'] = makeMatch(state, 'MQF3', rankOf('C',1), rankOf('D',2), 'Perempat Final \u2014 Main Draw');
  m['MQF4'] = makeMatch(state, 'MQF4', rankOf('D',1), rankOf('C',2), 'Perempat Final \u2014 Main Draw');
  m['CQF1'] = makeMatch(state, 'CQF1', rankOf('A',3), m['PI-B'].winner, 'Perempat Final \u2014 Consolation');
  m['CQF2'] = makeMatch(state, 'CQF2', rankOf('B',3), m['PI-A'].winner, 'Perempat Final \u2014 Consolation');
  m['CQF3'] = makeMatch(state, 'CQF3', rankOf('C',3), m['PI-D'].winner, 'Perempat Final \u2014 Consolation');
  m['CQF4'] = makeMatch(state, 'CQF4', rankOf('D',3), m['PI-C'].winner, 'Perempat Final \u2014 Consolation');
  m['MSF1'] = makeMatch(state, 'MSF1', m['MQF1'].winner, m['MQF2'].winner, 'Semifinal \u2014 Main Draw (Upper)');
  m['MSF2'] = makeMatch(state, 'MSF2', m['MQF3'].winner, m['MQF4'].winner, 'Semifinal \u2014 Main Draw (Upper)');
  m['CSF1'] = makeMatch(state, 'CSF1', m['CQF1'].winner, m['CQF2'].winner, 'Semifinal \u2014 Consolation (Lower)');
  m['CSF2'] = makeMatch(state, 'CSF2', m['CQF3'].winner, m['CQF4'].winner, 'Semifinal \u2014 Consolation (Lower)');
  m['M-FIN'] = makeMatch(state, 'M-FIN', m['MSF1'].winner, m['MSF2'].winner, 'Upper Final');
  m['C-FIN'] = makeMatch(state, 'C-FIN', m['CSF1'].winner, m['CSF2'].winner, 'Lower Final');
  m['W-SF1'] = makeMatch(state, 'W-SF1', rankOf('W',1), rankOf('W',4), 'Women Semifinal');
  m['W-SF2'] = makeMatch(state, 'W-SF2', rankOf('W',2), rankOf('W',3), 'Women Semifinal');
  m['W-FIN'] = makeMatch(state, 'W-FIN', m['W-SF1'].winner, m['W-SF2'].winner, 'Women Final');
  return { standings, matches: m };
}

function renderStandingsCard(state, g) {
  const st = computeStandings(state, g);
  const isWomen = g === 'W';
  const rowsHtml = st.ordered.map((p, i) => {
    const rank = i + 1;
    let cls = '';
    if (st.complete) {
      if (isWomen) { if (rank <= 4) cls = 'qualified'; }
      else { if (rank <= 2) cls = 'qualified'; else if (rank === 3) cls = 'bye'; }
    }
    const tag = st.complete ? (isWomen
        ? (rank <= 4 ? 'Semifinal' : 'Tersingkir')
        : (rank <= 2 ? 'Main Draw' : rank === 3 ? 'Cons. bye' : 'Play-in'))
      : '';
    return '<tr class="' + cls + '"><td class="rank">' + rank + '</td><td class="pname">' + esc(p.name) + (tag ? '<span class="tag-inline">' + tag + '</span>' : '') + '</td>' +
      '<td class="num">' + p.wins + '</td><td class="num">' + p.losses + '</td><td class="num">' + (p.gf - p.ga >= 0 ? '+' : '') + (p.gf - p.ga) + '</td><td class="num">' + p.wins + '</td></tr>';
  }).join('');

  const matches = getGroupMatches(g);
  const matchRows = matches.map(m => {
    const pairs = getPairs(g);
    const nameA = pairs[m.a-1], nameB = pairs[m.b-1];
    const sc = getGroupScore(state, g, m.a, m.b);
    const done = !!sc;
    const winA = done && sc[0] > sc[1], winB = done && sc[1] > sc[0];
    return '<div class="match-row' + (done ? ' done' : '') + '" data-group="' + g + '" data-a="' + m.a + '" data-b="' + m.b + '">' +
      '<div class="mnames"><span class="side' + (winA ? ' winner' : '') + '">' + esc(nameA) + '</span><span class="side' + (winB ? ' winner' : '') + '">' + esc(nameB) + '</span></div>' +

      '<button class="save-btn" data-action="save-group" ' + (isReadOnly?'disabled':'') + '>' + (done ? 'Ubah' : 'Simpan') + '</button>' +
      (done ? '<span class="done-check">\u2713</span>' : '<span style="width:5mm;"></span>') +
      '</div>';
  }).join('');

  return '<div class="card">' +
    '<div class="card-h"><span class="card-h-title"><span class="pill ' + groupPillClass(g) + '">' + (isWomen?'Women':'Men') + '</span>' + groupLabel(g) + '</span>' +
    '<span class="pill' + (st.complete ? ' good' : '') + '">' + st.completed + '/' + st.total + ' match' + (st.complete ? ' \u2014 Selesai' : '') + '</span></div>' +
    '<div class="card-body">' +
    '<div class="tbl-wrap"><table class="standings-tbl"><thead><tr><th>#</th><th>Pasangan</th><th class="num">W</th><th class="num">L</th><th class="num">GD</th><th class="num">PTS</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
    (st.complete ? '' : '<p class="standings-note">Standing sementara \u2014 urutan final setelah semua match grup ini selesai.</p>') +
    '<div class="match-list">' + matchRows + '</div>' +
    '</div></div>';
}

/* ================= Toast ================= */
function showToast(msg, isErr) {
  const host = document.getElementById('toast-host');
  if (!host) return;
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => { t.remove(); }, 3200);
}

/* ================= Admin mode (no PIN — plain toggle) ================= */
const ADMIN_STORAGE_KEY = 'usakti_padel_bm_admin_mode';
try { isReadOnly = localStorage.getItem(ADMIN_STORAGE_KEY) !== '1'; } catch (e) { isReadOnly = true; }

function refreshAdminUI() {
  const btn = document.getElementById('admin-btn');
  const modePill = document.getElementById('mode-pill');
  const resetBtn = document.getElementById('reset-btn');
  if (btn) btn.textContent = isReadOnly ? 'Mode Admin' : 'Mode Player';
  if (modePill) {
    modePill.textContent = isReadOnly ? '\ud83d\udc41 Player' : '\u2713 Admin';
    modePill.className = 'pill mode-pill' + (isReadOnly ? '' : ' good');
  }
  if (resetBtn) resetBtn.hidden = isReadOnly;
}

function toggleAdmin() {
  isReadOnly = !isReadOnly;
  try { localStorage.setItem(ADMIN_STORAGE_KEY, isReadOnly ? '0' : '1'); } catch (e) {}
  refreshAdminUI();
  render();
  showToast(isReadOnly ? 'Kembali ke mode Player.' : 'Mode Admin aktif \u2014 skor bisa diinput.');
}

async function resetAllScores() {
  if (isReadOnly) { showToast('Mode Player \u2014 tidak bisa reset.', true); return; }
  const ok1 = window.confirm('Hapus SEMUA skor (fase grup & babak gugur) untuk semua orang? Tindakan ini tidak bisa dibatalkan.');
  if (!ok1) return;
  const ok2 = window.confirm('Yakin? Semua skor yang sudah diinput akan hilang permanen.');
  if (!ok2) return;
  await saveState(emptyState());
  showToast('Semua skor sudah direset.');
}

/* ================= State sync ================= */
async function fetchState() {
  try {
    const res = await fetch('/.netlify/functions/state', { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function saveState(newState, btn) {
  if (isReadOnly) { showToast('Mode Player \u2014 tidak bisa menyimpan.', true); return; }
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/.netlify/functions/state', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ state: newState }),
    });
    if (!res.ok) {
      if (res.status === 404) {
        showToast('Backend belum aktif di site ini \u2014 skor tersimpan di perangkat ini saja untuk sementara.', true);
      } else {
        showToast('Gagal menyimpan ke server \u2014 coba lagi.', true);
      }
      if (btn) btn.disabled = false;
      // keep the edit visible locally even if the server save failed
      STATE = newState;
      render();
      return;
    }
    STATE = await res.json();
    render();
    showToast('Tersimpan.');
  } catch (e) {
    showToast('Gagal terhubung ke server \u2014 skor tersimpan di perangkat ini saja untuk sementara.', true);
    STATE = newState;
    render();
    if (btn) btn.disabled = false;
  }
}

/* ================= Render ================= */
function render() {
  document.getElementById('app-root').innerHTML = renderAppRoot(STATE);
}

/* ================= Score entry handlers ================= */
function readScorePair(container) {
  const ia = container.querySelector('.score-a'), ib = container.querySelector('.score-b');
  const va = ia.value.trim(), vb = ib.value.trim();
  if (va === '' || vb === '') { showToast('Isi skor kedua sisi.', true); return null; }
  const na = Number(va), nb = Number(vb);
  if (!Number.isInteger(na) || !Number.isInteger(nb) || na < 0 || nb < 0) { showToast('Skor harus angka bulat \u2265 0.', true); return null; }
  if (na === nb) { showToast('Skor tidak boleh seri \u2014 harus ada pemenang.', true); return null; }
  return [na, nb];
}

function updateLiveClock() {
  const el = document.getElementById('live-clock-text');
  if (!el) return;
  const now = new Date();
  const wib = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
  const hh = String(wib.getHours()).padStart(2,'0'), mm = String(wib.getMinutes()).padStart(2,'0');
  el.textContent = hh + '.' + mm + ' WIB';
}

document.addEventListener('DOMContentLoaded', async () => {
  updateLiveClock();
  setInterval(updateLiveClock, 30000);
  refreshAdminUI();

  // Initial load from server
  const loaded = await fetchState();
  if (loaded) STATE = Object.assign(emptyState(), loaded, {
    groupScores: Object.assign({A:{},B:{},C:{},D:{},W:{}}, loaded.groupScores || {}),
    koScores: Object.assign({}, loaded.koScores || {}),
  });
  render();

  // Poll for updates from other viewers (skip if an input is actively focused)
  setInterval(async () => {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT') && active.closest('#app-root')) return;
    const loaded2 = await fetchState();
    if (loaded2) {
      const before = JSON.stringify(STATE);
      const merged = Object.assign(emptyState(), loaded2, {
        groupScores: Object.assign({A:{},B:{},C:{},D:{},W:{}}, loaded2.groupScores || {}),
        koScores: Object.assign({}, loaded2.koScores || {}),
      });
      const after = JSON.stringify(merged);
      if (before !== after) { STATE = merged; render(); }
    }
  }, 20000);

  document.getElementById('topbar').addEventListener('click', (e) => {
    const tabBtn = e.target.closest('.tab-btn');
    if (tabBtn) {
      activeTab = tabBtn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', b === tabBtn ? 'true' : 'false'));
      document.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== activeTab; });
      return;
    }
    const adminBtn = e.target.closest('#admin-btn');
    if (adminBtn) { toggleAdmin(); return; }
    const resetBtn = e.target.closest('#reset-btn');
    if (resetBtn) { resetAllScores(); }
  });

  document.getElementById('app-root').addEventListener('click', async (e) => {
    const groupBtn = e.target.closest('[data-action="save-group"]');
    if (groupBtn) {
      const row = groupBtn.closest('.match-row');
      const pair = readScorePair(row);
      if (!pair) return;
      const g = row.dataset.group, a = Number(row.dataset.a), b = Number(row.dataset.b);
      const ns = cloneState();
      ns.groupScores[g][matchKey(a,b)] = pair;
      await saveState(ns, groupBtn);
      return;
    }
    const koBtn = e.target.closest('[data-action="save-ko"]');
    if (koBtn) {
      const box = koBtn.closest('.bbox');
      const pair = readScorePair(box);
      if (!pair) return;
      const ns = cloneState();
      ns.koScores[box.dataset.id] = pair;
      await saveState(ns, koBtn);
      return;
    }
  });
});
</script>
</body>
</html>
